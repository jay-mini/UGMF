[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugmf"
version = "0.1.0"
description = "Unified Generative Modeling Framework"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "tqdm",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
eval = [
    "torch-fidelity>=0.4.0",
]
diffusers = [
    "diffusers>=0.35,<0.38",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
