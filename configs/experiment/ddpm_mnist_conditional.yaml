objective: ddpm
dataset: mnist

data_dir: data
output_dir: outputs/ddpm_mnist_conditional

batch_size: 64
num_epochs: 2
max_steps: null

lr: 0.0002
weight_decay: 0.0001
scheduler: cosine
scheduler_total_steps: null
scheduler_min_lr: 0.0

base_channels: 32
time_dim: 128

num_workers: 0
mixed_precision: fp16
grad_clip: 1.0

log_every: 100
save_every: 938
seed: 42
class_cond: true
cond_drop_prob: 0.1
guidance_scale: 3.0

# With the linear beta schedule, 1000 steps give alpha_bar_T ~= 4e-5.
# The terminal training distribution is therefore close to N(0, I), matching
# the sampler's initial-noise assumption. The 100-step smoke config does not.
num_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02
prediction_type: epsilon

ema_decay: 0.999
ema_update_after_step: 100
ema_update_every: 1
