objective: ddpm
dataset: mnist

data_dir: data
output_dir: outputs/ddpm_mnist_conditional_smoke

batch_size: 32
num_epochs: 1
max_steps: 5

lr: 0.0002
weight_decay: 0.0001
scheduler: cosine
scheduler_total_steps: null
scheduler_min_lr: 0.0

base_channels: 16
time_dim: 64

num_workers: 0
mixed_precision: fp16
grad_clip: 1.0

log_every: 1
save_every: 5
seed: 42
class_cond: true
cond_drop_prob: 0.1
guidance_scale: 3.0

num_timesteps: 100
beta_start: 0.0001
beta_end: 0.02
prediction_type: epsilon

ema_decay: 0.999
ema_update_after_step: 0
ema_update_every: 1
